<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Linter</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="header-logo">&#10003;</div>
      <span class="header-title">Brand Linter</span>
    </div>
  </header>

  <!-- ── Upload ──────────────────────────────────────────────────────── -->
  <div id="upload-section">
    <div class="hero">
      <h1 class="hero-title">Document compliance,<br>automated.</h1>
      <p class="hero-sub">Upload a Word document and check it against your brand guidelines in seconds.</p>
    </div>

    <div class="upload-card">
      <form id="upload-form" novalidate>

        <div class="field">
          <label for="template-select">Brand template</label>
          <select id="template-select" name="template" required>
            {% for t in templates %}
            <option value="{{ t.slug }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="file-input">Document <span class="hint">(.docx)</span></label>
          <div class="file-drop" id="file-drop">
            <input type="file" id="file-input" name="file" accept=".docx" required>
            <span class="file-drop-icon">&#128196;</span>
            <span class="file-drop-label" id="file-drop-label">
              Drop your file here, or click to browse
            </span>
            <span class="file-drop-hint">Supports .docx files</span>
          </div>
        </div>

        <div id="upload-error" class="error-banner" hidden></div>

        <button type="submit" id="submit-btn" class="btn-primary" disabled>
          Upload &amp; Lint
        </button>

      </form>
    </div>
  </div>

  <!-- ── Review ──────────────────────────────────────────────────────── -->
  <div id="review-section" hidden>

    <!-- Sticky top bar -->
    <div class="review-top-bar">
      <div class="review-top-bar-inner">
        <button class="btn-ghost-sm" id="back-btn">&#8592; Back</button>
        <div class="review-top-summary" id="summary-banner"></div>
        <div class="review-top-actions">
          <!-- Legend -->
          <span class="legend">
            <span class="legend-dot legend-change"></span>Suggested change
          </span>
          <span class="legend">
            <span class="legend-dot legend-violation"></span>Violation
          </span>
          <button class="btn-ghost-sm" id="accept-all-btn">&#10003; Accept all</button>
          <label class="toggle-label">
            <input type="checkbox" id="show-all-toggle"> Show all
          </label>
          <button class="btn-primary-sm" id="download-btn">&#8681; Download</button>
        </div>
      </div>
    </div>

    <!-- Document + suggestions sidebar -->
    <div class="doc-layout">
      <div class="doc-scroll" id="doc-scroll">
        <div class="doc-pane" id="document-column"></div>
      </div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Suggestions</div>
        <div id="sidebar-list"></div>
      </aside>
    </div>

  </div>

  <!-- ── Loading overlay ─────────────────────────────────────────────── -->
  <div id="loading-overlay" hidden>
    <div class="spinner"></div>
    <p>Linting document…</p>
  </div>

  <script>
    window.BRAND_LINTER = {};
  </script>
  <script src="/static/app.js"></script>

</body>
</html>
